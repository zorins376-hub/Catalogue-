name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Activate pnpm via Corepack (bundled with Node) instead of a third-party
      # action, so the job works even when the repo restricts non-GitHub actions.
      # Version comes from the root package.json "packageManager" field.
      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @wasser/web build
